<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links - STD Engenharia</title>
    
    <!-- Tailwind CSS para Estilização Rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome para os Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS para ajustes finos -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="no-scroll relative">

    <!-- Tela Escura de Abertura / Overlay -->
    <div id="loader" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-zinc-900">
        <div class="w-12 h-12 border-4 border-white border-t-transparent rounded-full animate-spin"></div>
    </div>

    <!-- Conteúdo Principal -->
    <main class="min-h-screen flex flex-col items-center py-12 px-4 relative z-10 w-full max-w-2xl mx-auto">

        <!-- Cabeçalho de Perfil -->
        <header class="flex flex-col items-center text-center w-full mb-8">
            <!-- Logo com ajustes de padding para não cortar a imagem retangular -->
            <div id="logo"
                class="w-28 h-28 md:w-32 md:h-32 rounded-full overflow-hidden shadow-lg bg-white mb-4 opacity-0 flex items-center justify-center p-3">
                <img src="./img/std_logo_2016-removebg-preview-_1_.webp" alt="Logo STD Engenharia"
                    class="w-full h-full object-contain">
            </div>

            <!-- Título / Handle -->
            <h1 id="title" class="text-2xl font-bold tracking-tight opacity-0 text-white">@stdengenharia</h1>

            <!-- Subtítulo -->
            <p id="subtitle" class="text-sm font-bold text-gray-400 mt-2 opacity-0">PADRÃO EM QUALIDADE DESDE 1996</p>
        </header>

        <!-- Lista de Links -->
        <div class="flex flex-col w-full gap-4 pb-12">

            <!-- Link 1: Site Oficial -->
            <a href="https://stdengenharia.com.br/"
                class="link-card opacity-0 bg-gray-800 rounded-xl p-4 flex items-center shadow-md w-full">
                <div class="w-8 flex justify-center text-gray-300 text-xl link-icon">
                    <i class="fa-solid fa-sitemap"></i>
                </div>
                <div class="flex-1 text-center font-semibold text-gray-100 px-2 text-sm md:text-base link-text">
                    STD Standard Engenharia
                </div>
                <div class="w-8 flex justify-center text-gray-500">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </div>
            </a>

            <!-- Link 2: WhatsApp -->
            <a href="https://api.whatsapp.com/send/?phone=5511916930415&text&type=phone_number&app_absent=0"
                class="link-card opacity-0 bg-gray-800 rounded-xl p-4 flex items-center shadow-md w-full">
                <div class="w-8 flex justify-center text-gray-300 text-2xl link-icon">
                    <i class="fa-brands fa-whatsapp"></i>
                </div>
                <div class="flex-1 text-center font-semibold text-gray-100 px-2 text-sm md:text-base link-text">
                    Share on WhatsApp
                </div>
                <div class="w-8 flex justify-center text-gray-500">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </div>
            </a>

            <!-- Link 3: Instagram -->
            <a href="https://www.instagram.com/stdengenharia/"
                class="link-card opacity-0 bg-gray-800 rounded-xl p-4 flex items-center shadow-md w-full">
                <div class="w-8 flex justify-center text-gray-300 text-2xl link-icon">
                    <i class="fa-brands fa-instagram"></i>
                </div>
                <div class="flex-1 text-center font-semibold text-gray-100 px-2 text-sm md:text-base link-text">
                    Instagram stdengenharia
                </div>
                <div class="w-8 flex justify-center text-gray-500">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </div>
            </a>

            <!-- Link 4: Facebook -->
            <a href="https://web.facebook.com/stdengenharia?_rdc=1&_rdr#"
                class="link-card opacity-0 bg-gray-800 rounded-xl p-4 flex items-center shadow-md w-full">
                <div class="w-8 flex justify-center text-gray-300 text-xl link-icon">
                    <i class="fa-brands fa-facebook-f"></i>
                </div>
                <div class="flex-1 text-center font-semibold text-gray-100 px-2 text-sm md:text-base link-text">
                    Facebook
                </div>
                <div class="w-8 flex justify-center text-gray-500">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </div>
            </a>

            <!-- Link 5: YouTube -->
            <a href="https://www.youtube.com/@STDENGENHARIA1"
                class="link-card opacity-0 bg-gray-800 rounded-xl p-4 flex items-center shadow-md w-full">
                <div class="w-8 flex justify-center text-gray-300 text-xl link-icon">
                    <i class="fa-brands fa-youtube"></i>
                </div>
                <div class="flex-1 text-center font-semibold text-gray-100 px-2 text-sm md:text-base link-text">
                    YouTube
                </div>
                <div class="w-8 flex justify-center text-gray-500">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </div>
            </a>

            <!-- Link 6: LinkedIn -->
            <a href="https://www.linkedin.com/company/std-standard-engenharia-ltda-/?viewAsMember=true"
                class="link-card opacity-0 bg-gray-800 rounded-xl p-4 flex items-center shadow-md w-full">
                <div class="w-8 flex justify-center text-gray-300 text-2xl link-icon">
                    <i class="fa-brands fa-linkedin"></i>
                </div>
                <div class="flex-1 text-center font-semibold text-gray-100 px-2 text-sm md:text-base link-text">
                    STD Standard Engenharia - Inspeções e Testes | LinkedIn
                </div>
                <div class="w-8 flex justify-center text-gray-500">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </div>
            </a>

            <!-- Link 7: Email -->
            <a href="mailto:std@stdengenharia.com.br"
                class="link-card opacity-0 bg-gray-800 rounded-xl p-4 flex items-center shadow-md w-full">
                <div class="w-8 flex justify-center text-gray-300 text-xl link-icon">
                    <i class="fa-regular fa-envelope"></i>
                </div>
                <div class="flex-1 flex flex-col text-center font-semibold text-gray-100 px-2 link-text">
                    <span class="text-sm md:text-base">std@stdengenharia.com.br</span>
                    <span class="text-xs text-gray-400 font-normal mt-0.5"><i
                            class="fa-regular fa-envelope mr-1"></i>Email · std@stdengenharia.com.br</span>
                </div>
                <div class="w-8 flex justify-center text-gray-500">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </div>
            </a>

        </div>
    </main>

    <!-- GSAP Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const tl = gsap.timeline({
                onComplete: () => {
                    document.body.classList.remove('no-scroll');
                }
            });

            // 1. Desliza a tela de carregamento (Loader) para cima após um breve delay
            tl.to("#loader", {
                y: "-100%",
                duration: 0.8,
                ease: "expo.inOut",
                delay: 0.4
            })
            // 2. Anima a logo (bolinha) começando invisível (scale: 0) com efeito elástico
            .fromTo("#logo", 
                { scale: 0, opacity: 0 },
                { 
                    scale: 1, 
                    opacity: 1, 
                    duration: 1.2, 
                    ease: "elastic.out(1, 0.5)" 
                }, 
                "-=0.2"
            )
            // 3. Textos (@stdengenharia e o subtítulo) - fade in e deslizam de baixo para cima
            .fromTo(["#title", "#subtitle"], 
                { y: 20, opacity: 0 },
                { 
                    y: 0, 
                    opacity: 1, 
                    duration: 0.6, 
                    stagger: 0.1, 
                    ease: "power2.out" 
                }, 
                "-=0.8"
            )
            // 4. Anima os 7 cartões de link com stagger, deslizando para cima com efeito de rebote
            .fromTo(".link-card", 
                { y: 50, opacity: 0 },
                { 
                    y: 0, 
                    opacity: 1, 
                    duration: 0.6, 
                    stagger: 0.1, 
                    ease: "back.out(1.5)" 
                }, 
                "-=0.4"
            );
        });
    </script>
</body>
</html>
